<script>
    // live2d-widget-v3 组件地址，用来加载 moc3 模型
    const widgetPath = "https://cdn.jsdelivr.net/gh/letere-gzj/live2d-widget-v3@main";

    // vercount 文章浏览数统计
    const vercountScript = document.createElement("script");
    vercountScript.defer = true;
    vercountScript.src = "https://cn.vercount.one/js";
    document.head.appendChild(vercountScript);

    function showHideViewCount() {
        const viewCounts = document.querySelectorAll("#viewCount");
        if (!viewCounts.length) {
            return;
        }

        // details.html 也会用于首页文章列表，只在文章详情页显示浏览数。
        if (!document.querySelector(".article-page")) {
            viewCounts.forEach((element) => {
                element.style.display = "none";
            });
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", showHideViewCount, { once: true });
    } else {
        showHideViewCount();
    }

    // 你的模型静态资源仓库地址
    // 注意：这里用的是你的 GitHub tag：v1.0.0
    // 注意：最后一定要有 /
    const modelPath = "https://cdn.jsdelivr.net/gh/sorastyx/static-resources@v1.0.11/";

    const config = {
        path: {
            homePath: "/",
            modelPath: modelPath,
            cssPath: widgetPath + "/waifu.css",
            tipsJsonPath: widgetPath + "/waifu-tips.json",
            tipsJsPath: widgetPath + "/waifu-tips.js",
            live2dCorePath: widgetPath + "/Core/live2dcubismcore.js",
            live2dSdkPath: widgetPath + "/live2d-sdk.js"
        },

        // 工具栏
        tools: [
            "hitokoto",
            "asteroids",
            "express",
            "switch-model",
            "switch-texture",
            "photo",
            "info",
            "quit"
        ],

        // 模型拖拽
        drag: {
            enable: true,
            direction: ["x", "y"]
        },

        // 模型切换方式：order 顺序切换，random 随机切换
        switchType: "order"
    };

    // 异步加载 CSS / JS
    function loadExternalResource(url, type) {
        return new Promise((resolve, reject) => {
            let tag;

            if (type === "css") {
                tag = document.createElement("link");
                tag.rel = "stylesheet";
                tag.href = url;
            } else if (type === "js") {
                tag = document.createElement("script");
                tag.src = url;
            }

            if (tag) {
                tag.onload = () => resolve(url);
                tag.onerror = () => reject(new Error("Failed to load: " + url));
                document.head.appendChild(tag);
            } else {
                reject(new Error("Unknown resource type: " + type));
            }
        });
    }

    // 屏幕宽度 >= 768 时加载看板娘
    if (screen.width >= 768) {
        Promise.all([
            loadExternalResource(config.path.cssPath, "css"),
            loadExternalResource(config.path.live2dCorePath, "js"),
            loadExternalResource(config.path.live2dSdkPath, "js"),
            loadExternalResource(config.path.tipsJsPath, "js")
        ]).then(() => {
            initWidget({
                homePath: config.path.homePath,
                waifuPath: config.path.tipsJsonPath,
                cdnPath: config.path.modelPath,
                tools: config.tools,
                dragEnable: config.drag.enable,
                dragDirection: config.drag.direction,
                switchType: config.switchType
            });
        }).catch((error) => {
            console.error("Live2D load error:", error);
        });
    }
</script>

    /**

    function initScrollTop() {
        let rightSideBar = document.querySelector(".right-sidebar");
        if (!rightSideBar) {
            return;
        }
        // 添加返回顶部按钮到右侧边栏

        btn.onclick = backToTop
        rightSideBar.appendChild(btn)
        // 滚动监听
        window.onscroll = function() {
            // 当网页向下滑动 20px 出现"返回顶部" 按钮
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };
    }

    /**
     * 返回顶部
     */
    function backToTop(){
        window.scrollTo({ top: 0, behavior: "smooth" })
    }

    initScrollTop();
</script>

<script>
  function initCodeMoreBox() {
    let codeBlocks = document.querySelectorAll(".highlight");
    if (!codeBlocks) {
      return;
    }
    codeBlocks.forEach(codeBlock => {
      // 校验是否overflow
      if (codeBlock.scrollHeight <= codeBlock.clientHeight) {
        return;
      }
      // 元素初始化
      // codeMoreBox
      let codeMoreBox = document.createElement('div');
      codeMoreBox.classList.add('code-more-box');
      // codeMoreBtn
      let codeMoreBtn = document.createElement('span');
      codeMoreBtn.classList.add('code-more-btn');
      codeMoreBtn.addEventListener('click', () => {
        codeBlock.classList.add('code-show');
        codeMoreBox.style.display = 'none';
        // 触发resize事件，重新计算目录位置
        window.dispatchEvent(new Event('resize'))
      })
      // img
      let img = document.createElement('img');
      img.classList.add('code-more-img');
      img.src = {{ (resources.Get "icons/codeMore.png").Permalink }}
      // 元素添加
      codeMoreBtn.appendChild(img);
      codeMoreBox.appendChild(codeMoreBtn);
      codeBlock.appendChild(codeMoreBox)
    })
  }
  
  initCodeMoreBox();
</script>

<script>
    (() => {
        const gates = document.querySelectorAll(".password-gate");
        if (!gates.length || !window.crypto?.subtle) {
            return;
        }

        const fromBase64 = (value) => Uint8Array.from(atob(value), (character) => character.charCodeAt(0));

        const decryptContent = async (password, payload) => {
            const passwordKey = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: fromBase64(payload.salt),
                    iterations: payload.iterations,
                    hash: "SHA-256"
                },
                passwordKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
            const plainText = await crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: fromBase64(payload.iv),
                    tagLength: 128
                },
                key,
                fromBase64(payload.data)
            );
            return new TextDecoder().decode(plainText);
        };

        gates.forEach((gate) => {
            const form = gate.querySelector(".password-gate-form");
            const input = gate.querySelector(".password-gate-input");
            const error = gate.querySelector(".password-gate-error");
            const protectedContent = gate.parentElement.querySelector(".article-content--protected");
            let payloadPromise;

            const getPayload = () => {
                if (!payloadPromise) {
                    payloadPromise = fetch(gate.parentElement.dataset.contentUrl, { cache: "no-store" })
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error("Protected content request failed");
                            }
                            return response.json();
                        });
                }
                return payloadPromise;
            };

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                error.hidden = true;

                try {
                    const html = await decryptContent(input.value, await getPayload());
                   protectedContent.innerHTML = html;
                   protectedContent.hidden = false;
                    if (gate.parentElement.dataset.birthdayEffects === "true") {
                        window.startBirthdayCelebration?.();
                        window.startBirthdayLive2DBlessings?.();
                    }
                   gate.remove();
                } catch (exception) {
                    error.textContent = exception.name === "OperationError"
                        ? "密码不正确，请重试。"
                        : "文章资源加载失败，请稍后重试。";
                    error.hidden = false;
                    input.select();
                }
            });
        });
    })();
</script>

<script>
    (() => {
        const birthdayMessages = [
            "生日快乐呀，愿你眼里有星光，心中有清欢，所遇皆温柔。",
            "愿新的一岁，烦恼轻一些，欢喜多一些，想去的地方都能抵达。",
            "愿你被爱意簇拥，也被自己的光照亮，永远漂亮又自由。",
            "今天的愿望一定会被星星听见，愿你岁岁欢愉，年年如意。"
        ];

        window.startBirthdayLive2DBlessings = () => {
            if (window.__birthdayLive2DStarted) {
                return;
            }
            window.__birthdayLive2DStarted = true;

            let messageIndex = 0;
            let attempts = 0;

            const showNextMessage = () => {
                const tips = document.getElementById("waifu-tips");
                if (!tips) {
                    if (attempts++ < 30) {
                        window.setTimeout(showNextMessage, 500);
                    }
                    return;
                }

                const message = birthdayMessages[messageIndex++];
                tips.textContent = message;
                tips.classList.add("waifu-tips-active");

                const keepVisible = window.setInterval(() => {
                    tips.classList.add("waifu-tips-active");
                }, 300);

                window.setTimeout(() => {
                    window.clearInterval(keepVisible);
                    tips.classList.remove("waifu-tips-active");
                }, 4800);

                if (messageIndex < birthdayMessages.length) {
                    window.setTimeout(showNextMessage, 5200);
                }
            };

            showNextMessage();
        };

        window.startBirthdayCelebration = () => {
            const celebration = document.getElementById("birthday-celebration");
            const canvas = celebration?.querySelector(".birthday-particles");
            const context = canvas?.getContext("2d");
            if (!celebration || !canvas || !context || celebration.dataset.started === "true") {
                return;
            }

            celebration.dataset.started = "true";
            celebration.hidden = false;
            celebration.classList.remove("is-fading");

            const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
            const colors = ["#ffd166", "#f08a9e", "#82c9d8", "#fff0ca", "#b78de0"];
            const types = ["confetti", "star", "heart", "sparkle"];
            const particles = [];
            let width = window.innerWidth;
            let height = window.innerHeight;
            let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

            const resizeCanvas = () => {
                width = window.innerWidth;
                height = window.innerHeight;
                pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(width * pixelRatio);
                canvas.height = Math.floor(height * pixelRatio);
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";
                context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            };

            const random = (min, max) => Math.random() * (max - min) + min;
            const particleCount = reducedMotion ? 34 : 110;

            for (let index = 0; index < particleCount; index += 1) {
                particles.push({
                    x: random(0, width),
                    y: random(-height * 0.2, height),
                    vx: random(-0.8, 0.8),
                    vy: random(1.2, 3.4),
                    size: random(5, 12),
                    rotation: random(0, Math.PI * 2),
                    rotationSpeed: random(-0.08, 0.08),
                    color: colors[index % colors.length],
                    type: types[index % types.length]
                });
            }

            const drawStar = (particle) => {
                context.beginPath();
                for (let point = 0; point < 10; point += 1) {
                    const radius = point % 2 === 0 ? particle.size : particle.size * 0.42;
                    const angle = particle.rotation + point * Math.PI / 5;
                    const x = particle.x + Math.cos(angle) * radius;
                    const y = particle.y + Math.sin(angle) * radius;
                    if (point === 0) {
                        context.moveTo(x, y);
                    } else {
                        context.lineTo(x, y);
                    }
                }
                context.closePath();
                context.fill();
            };

            const drawHeart = (particle) => {
                const size = particle.size;
                context.save();
                context.translate(particle.x, particle.y);
                context.rotate(particle.rotation);
                context.beginPath();
                context.moveTo(0, size * 0.9);
                context.bezierCurveTo(-size * 1.2, size * 0.15, -size * 0.9, -size * 0.75, 0, -size * 0.1);
                context.bezierCurveTo(size * 0.9, -size * 0.75, size * 1.2, size * 0.15, 0, size * 0.9);
                context.fill();
                context.restore();
            };

            const drawParticle = (particle) => {
                context.fillStyle = particle.color;
                context.save();
                context.translate(particle.x, particle.y);
                context.rotate(particle.rotation);

                if (particle.type === "confetti") {
                    context.fillRect(-particle.size * 0.55, -particle.size * 0.3, particle.size * 1.1, particle.size * 0.6);
                } else if (particle.type === "star") {
                    context.restore();
                    drawStar(particle);
                    return;
                } else if (particle.type === "heart") {
                    context.restore();
                    drawHeart(particle);
                    return;
                } else {
                    context.beginPath();
                    context.arc(0, 0, particle.size * 0.45, 0, Math.PI * 2);
                    context.fill();
                }

                context.restore();
            };

            const startTime = performance.now();
            const duration = reducedMotion ? 3600 : 7200;
            let animationFrame;

            const render = (now) => {
                const elapsed = now - startTime;
                const fadeProgress = Math.max(0, (elapsed - duration + 1200) / 1200);
                context.clearRect(0, 0, width, height);
                context.globalAlpha = 1 - Math.min(fadeProgress, 1);

                particles.forEach((particle) => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.018;
                    particle.rotation += particle.rotationSpeed;

                    if (particle.y > height + 24) {
                        particle.y = random(-80, -20);
                        particle.x = random(0, width);
                        particle.vy = random(1.2, 3.4);
                    }

                    drawParticle(particle);
                });

                context.globalAlpha = 1;
                if (elapsed < duration) {
                    animationFrame = window.requestAnimationFrame(render);
                } else {
                    window.cancelAnimationFrame(animationFrame);
                    celebration.classList.add("is-fading");
                    window.setTimeout(() => {
                        celebration.hidden = true;
                        celebration.classList.remove("is-fading");
                        delete celebration.dataset.started;
                        window.removeEventListener("resize", resizeCanvas);
                        context.clearRect(0, 0, width, height);
                    }, 1300);
                }
            };

            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);
           window.requestAnimationFrame(render);
       };
   })();
</script>
